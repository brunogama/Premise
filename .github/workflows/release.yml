name: Release package checks

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-exclusion:
    name: Verify macro exclusion
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify package manifest
        run: bash scripts/test-macro-exclusion.sh
