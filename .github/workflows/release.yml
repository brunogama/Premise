name: Release Macro Binary

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build artifacts for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  PREMISE_MACRO_SOURCE: "1"
  ARTIFACT_NAME: PremiseMacrosPlugin

jobs:
  # ---------------------------------------------------------------------------
  # Build the macro plugin binary for each platform
  # ---------------------------------------------------------------------------
  build-macro:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            container: ""
            arch_flag: "--arch arm64"
          - platform: macos-x86_64
            runner: macos-15
            container: ""
            arch_flag: "--arch x86_64"
          - platform: linux-x86_64
            runner: ubuntu-latest
            container: swift:6.2
            arch_flag: ""
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: swift:6.2
            arch_flag: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and assert Swift toolchain
        uses: ./.github/actions/select-swift-toolchain
        with:
          swift-version: "6.2"
          select: ${{ matrix.container == '' }}

      - name: Build macro plugin (release)
        run: |
          swift build \
            --product "$ARTIFACT_NAME" \
            --configuration release \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete \
            ${{ matrix.arch_flag }}

      - name: Locate and prepare binary
        id: binary
        run: |
          # Search known build output paths for the executable.
          BIN_PATH=""
          for candidate in \
            ".build/apple/Products/Release/${ARTIFACT_NAME}" \
            ".build/apple/Products/Release/${ARTIFACT_NAME}-tool" \
            "$(swift build --product "$ARTIFACT_NAME" --configuration release --show-bin-path 2>/dev/null)/${ARTIFACT_NAME}" \
            "$(swift build --product "$ARTIFACT_NAME" --configuration release --show-bin-path 2>/dev/null)/${ARTIFACT_NAME}-tool" \
            ".build/release/${ARTIFACT_NAME}" \
            ".build/release/${ARTIFACT_NAME}-tool"; do
            if [[ -f "$candidate" ]]; then
              BIN_PATH="$candidate"
              break
            fi
          done

          if [[ -z "$BIN_PATH" ]]; then
            echo "::error::Could not locate built binary for ${{ matrix.platform }}"
            find .build -name "${ARTIFACT_NAME}*" -type f 2>/dev/null || true
            exit 1
          fi

          # Strip debug symbols.
          strip "$BIN_PATH" 2>/dev/null || true

          mkdir -p "artifact/${{ matrix.platform }}/bin"
          cp "$BIN_PATH" "artifact/${{ matrix.platform }}/bin/${ARTIFACT_NAME}"
          chmod +x "artifact/${{ matrix.platform }}/bin/${ARTIFACT_NAME}"

          echo "size=$(du -h "artifact/${{ matrix.platform }}/bin/${ARTIFACT_NAME}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-${{ matrix.platform }}
          path: artifact/${{ matrix.platform }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Assemble the artifact bundle and attach to the release
  # ---------------------------------------------------------------------------
  assemble-bundle:
    name: Assemble artifact bundle
    needs: build-macro
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and assert Swift toolchain
        uses: ./.github/actions/select-swift-toolchain
        with:
          swift-version: "6.2"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: platforms
          pattern: macro-*

      - name: Assemble artifact bundle
        id: bundle
        run: |
          BUNDLE="${ARTIFACT_NAME}.artifactbundle"
          rm -rf "$BUNDLE"

          # Copy each platform binary into the bundle.
          for dir in platforms/macro-*; do
            platform="$(basename "$dir" | sed 's/^macro-//')"
            mkdir -p "${BUNDLE}/${platform}/bin"
            cp "${dir}/${platform}/bin/${ARTIFACT_NAME}" "${BUNDLE}/${platform}/bin/${ARTIFACT_NAME}"
            chmod +x "${BUNDLE}/${platform}/bin/${ARTIFACT_NAME}"
          done

          # Detect which platforms were built.
          PLATFORMS=()
          for dir in "${BUNDLE}"/*/; do
            PLATFORMS+=("$(basename "$dir")")
          done

          # Map platform keys to Swift triples.
          triple_for() {
            case "$1" in
              macos-arm64)   echo "arm64-apple-macosx" ;;
              macos-x86_64)  echo "x86_64-apple-macosx" ;;
              linux-arm64)   echo "aarch64-unknown-linux-gnu" ;;
              linux-x86_64)  echo "x86_64-unknown-linux-gnu" ;;
            esac
          }

          # Build variants JSON.
          VARIANTS=""
          for p in "${PLATFORMS[@]}"; do
            triple="$(triple_for "$p")"
            if [[ -n "$VARIANTS" ]]; then VARIANTS+=","; fi
            VARIANTS+="
              {
                \"path\": \"${p}/bin/${ARTIFACT_NAME}\",
                \"supportedTriples\": [\"${triple}\"]
              }"
          done

          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"

          cat > "${BUNDLE}/info.json" <<EOF
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "${ARTIFACT_NAME}": {
                "version": "${VERSION}",
                "type": "executable",
                "variants": [${VARIANTS}
                ]
              }
            }
          }
          EOF

          # Zip the bundle.
          zip -r -y "${ARTIFACT_NAME}.artifactbundle.zip" "$BUNDLE"

          # Compute checksum.
          CHECKSUM="$(swift package compute-checksum "${ARTIFACT_NAME}.artifactbundle.zip")"
          echo "$CHECKSUM" > checksum.txt

          {
            echo "checksum=$CHECKSUM"
            echo "zip=${ARTIFACT_NAME}.artifactbundle.zip"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Artifact Bundle"
            echo ""
            echo "- **Platforms**: ${PLATFORMS[*]}"
            echo "- **Checksum**: \`$CHECKSUM\`"
            echo "- **Size**: $(du -h "${ARTIFACT_NAME}.artifactbundle.zip" | cut -f1)"
            echo ""
            echo "Update \`Package.swift\` checksum:"
            echo '```'
            echo "checksum: \"$CHECKSUM\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" \
            "${{ steps.bundle.outputs.zip }}" \
            checksum.txt \
            --clobber

      - name: Verify binary macro manifest
        env:
          PREMISE_MACRO_BINARY: "1"
          PREMISE_MACRO_BINARY_CHECKSUM: ${{ steps.bundle.outputs.checksum }}
        run: |
          swift package dump-package > /dev/null

      - name: Comment checksum on release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          CHECKSUM="${{ steps.bundle.outputs.checksum }}"

          BODY="## Pre-built Macro Binary

          The \`PremiseMacrosPlugin.artifactbundle.zip\` is attached to this release.

          **Checksum:** \`${CHECKSUM}\`

          Users get this automatically — no need to compile swift-syntax.

          To build from source instead:
          \`\`\`bash
          PREMISE_MACRO_SOURCE=1 swift build
          \`\`\`"

          gh release edit "$TAG" --notes "$BODY"
