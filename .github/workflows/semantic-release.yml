name: Semantic version tags

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release-quality:
    name: Release quality gates
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name ==
        github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: macos-26
    steps:
      - name: Check out the successful main CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select and assert Swift toolchain
        uses: ./.github/actions/select-swift-toolchain
        with:
          swift-version: "6.3"

      - name: Install release validation tools
        run: |
          brew list --versions swiftlint >/dev/null || brew install swiftlint
          brew list --versions z3 >/dev/null || brew install z3
          brew list --versions pkg-config >/dev/null || brew install pkg-config

      - name: Check strict Swift formatting
        run: |
          swift format lint --strict --configuration .swift-format \
            --recursive Package.swift Sources Tests Plugins scripts

      - name: Run strict root SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Fresh build and SwiftLint analyzer
        run: sh scripts/run_swiftlint_analyze.sh

      - name: Run repository QA
        run: swift scripts/qa_repository.swift .

  publish:
    name: Commit README and tag
    needs: release-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated main CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Publish the semantic version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: >-
            41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: >-
            41898282+github-actions[bot]@users.noreply.github.com
          GIT_TERMINAL_PROMPT: "0"
        run: python3 -B scripts/release_version.py --publish
