name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - gsd/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS (primary — builds + tests everything)
  #
  # Toolchains are selected by probing installed Xcodes for the Swift version
  # they actually ship (scripts/select-swift-toolchain.sh). The job fails when
  # the requested Swift version is unavailable or the selected toolchain does
  # not report it — no silent fallback to the runner default.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Swift ${{ matrix.swift }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported floor: Swift 6.2 (Xcode 26) on both hosted macOS images.
          - swift: "6.2"
            runner: macos-26
          - swift: "6.2"
            runner: macos-15
          # Current stable Swift.
          - swift: "6.3"
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: bash scripts/select-swift-toolchain.sh "${{ matrix.swift }}"

      - name: Assert active Swift version
        run: bash scripts/select-swift-toolchain.sh --assert-only "${{ matrix.swift }}"

      - name: Run boundary validation
        run: bash scripts/validate-boundaries.sh

      - name: Build (all targets)
        run: |
          swift build \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

      - name: Test
        run: |
          swift test \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

  # ---------------------------------------------------------------------------
  # Linux (verify cross-platform compilation and tests)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift:
          # Supported floor.
          - "6.2"
          # Current stable Swift.
          - "6.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert active Swift version
        run: bash scripts/select-swift-toolchain.sh --assert-only "${{ matrix.swift }}"

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev pkg-config

      - name: Build (all targets)
        run: |
          swift build \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

      - name: Test
        run: |
          swift test \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

  # ---------------------------------------------------------------------------
  # Apple destination compile checks (products must compile for the platforms
  # the package declares; simulators cover device SDK compilation)
  # ---------------------------------------------------------------------------
  apple-destinations:
    name: ${{ matrix.platform }} compile (Swift ${{ matrix.swift }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
        platform:
          - "iOS Simulator"
          - "watchOS Simulator"
          - "tvOS Simulator"
          - "visionOS Simulator"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: bash scripts/select-swift-toolchain.sh "${{ matrix.swift }}"

      - name: Assert active Swift version
        run: bash scripts/select-swift-toolchain.sh --assert-only "${{ matrix.swift }}"

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -skipMacroValidation \
            -scheme SwiftPremise-Package \
            -destination "generic/platform=${{ matrix.platform }}" \
            -derivedDataPath .build/xcodebuild

  # ---------------------------------------------------------------------------
  # Macro smoke tests (default macro-free mode plus source macro opt-in)
  # ---------------------------------------------------------------------------
  macro-binary-check:
    name: Macro manifest and source checks
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: bash scripts/select-swift-toolchain.sh "6.2"

      - name: Assert active Swift version
        run: bash scripts/select-swift-toolchain.sh --assert-only "6.2"

      - name: Verify default macro-free manifest
        run: |
          swift package dump-package > /dev/null

      - name: Verify source macro opt-in manifest
        run: |
          PREMISE_MACRO_SOURCE=1 swift package dump-package > /dev/null

      - name: Build source macro opt-in
        run: |
          PREMISE_MACRO_SOURCE=1 swift build \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete
