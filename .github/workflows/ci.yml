name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - gsd/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS (primary package build and tests)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            runner: macos-15
          - swift: "6.3"
            runner: macos-15
          - swift: "6.2"
            runner: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: |
          if [[ "${{ matrix.swift }}" == "6.3" ]]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app || true
          elif [[ "${{ matrix.swift }}" == "6.2" ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app || true
          elif [[ "${{ matrix.swift }}" == "6.1" ]]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app || true
          fi
          swift --version

      - name: Install Z3
        run: brew list --versions z3 >/dev/null || brew install z3

      - name: Run boundary validation
        run: bash scripts/validate-boundaries.sh

      - name: Build (all targets)
        run: |
          swift build \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

      - name: Build documentation
        run: bash scripts/build-documentation.sh

      - name: Test
        run: |
          swift test \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

  # ---------------------------------------------------------------------------
  # Linux (verify cross-platform compilation)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "6.2"
          - "6.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build (all targets)
        run: |
          swift build \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

      - name: Test
        run: |
          swift test \
            --explicit-target-dependency-import-check error \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete

  # ---------------------------------------------------------------------------
  # Verify that legacy macro flags do not expose a macro product this release.
  macro-exclusion-check:
    name: Macro exclusion
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify package manifest
        run: bash scripts/test-macro-exclusion.sh
