default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
fail_fast = true
default_language_version = { swift = "6.0" }
minimum_pre_commit_version = "3.0.0"
[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files", args = ["--maxkb=1000"] },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "trailing-whitespace", exclude = '\.md$' },
    { id = "end-of-file-fixer" },
    { id = "check-case-conflict" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    # PEM documentation contains key-format labels, not private-key material.
    { id = "detect-private-key", exclude = '^\.pi/skills/swift-security/references/cryptokit-public-key\.md$' },
    { id = "check-illegal-windows-names" },

    { id = "check-executables-have-shebangs" },
    { id = "check-symlinks" },
]

[[repos]]
repo = "local"


[[repos.hooks]]
id = "gitleaks"
name = "Gitleaks staged secrets"
language = "system"
entry = "gitleaks git --pre-commit --staged --redact --no-banner"
pass_filenames = false
always_run = true
[[repos.hooks]]
id = "format-staged"
name = "Format staged text and Swift files"
language = "system"
entry = "sh scripts/format_staged_files.sh"
files = ".*"
priority = 1

[[repos.hooks]]
id = "swiftlint-strict"
name = "SwiftLint strict"
language = "system"
entry = "sh scripts/lint_staged_swift.sh"
files = "\\.swift$"
priority = 2

[[repos.hooks]]
id = "swift-test"
name = "swift test"
language = "system"
entry = "swift test --disable-xctest"
files = "\\.swift$"
pass_filenames = false
priority = 3
[[repos]]
repo = "local"
[[repos.hooks]]
id = "repository-safety"
name = "Validate staged repository manifests and configs"
entry = "sh scripts/validate_staged_repository.sh"
language = "system"
files = '^(Package\.swift|\.swiftlint\.yml|\.swift-format)$'
pass_filenames = false
priority = 1
[[repos]]
repo = "local"
[[repos.hooks]]
id = "swift-beautifier"
name = "✨ Formatting Swift code..."
entry = "sh scripts/format_staged_files.sh"
language = "system"
files = '\.swift$'
exclude = "^Tests/.*/Resources/"
pass_filenames = true

[[repos.hooks]]
id = "swift-sheriff"
name = "🤠 Linting Swift code..."
entry = """bash -c 'root_files=(); docs_files=(); for file in "$@"; do case "$file" in docs/Documentation.docc/Resources/*) docs_files+=("$file") ;; *) root_files+=("$file") ;; esac; done; if ((${#root_files[@]})); then swiftlint lint --fix --config .swiftlint.yml "${root_files[@]}" && swiftlint lint --strict --config .swiftlint.yml "${root_files[@]}" || exit $?; fi; if ((${#docs_files[@]})); then swiftlint lint --fix --config docs/Documentation.docc/Resources/.swiftlint.yml "${docs_files[@]}" && swiftlint lint --strict --config docs/Documentation.docc/Resources/.swiftlint.yml "${docs_files[@]}" || exit $?; fi' --"""
language = "system"
files = '\.swift$'
exclude = "^Tests/.*/Resources/"
pass_filenames = true

[[repos.hooks]]
id = "branch-guardian"
name = "🚫 Checking branch protection..."
entry = """bash -c 'BRANCH=$(git rev-parse --abbrev-ref HEAD); if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "dev" ]; then echo "🛑 Direct commits to $BRANCH branch are not allowed! Use feature branches and PRs instead 🚀"; exit 1; fi'"""
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "license-year-updater"
name = "📅 Updating LICENSE year..."
entry = "bash -c 'if [ -f \"LICENSE\" ]; then CURRENT_YEAR=$(date +\"%Y\"); if sed --version >/dev/null 2>&1; then sed -i \"s/Copyright (c) [0-9]\\{4\\}/Copyright (c) $CURRENT_YEAR/\" LICENSE; else sed -i \"\" \"s/Copyright (c) [0-9]\\{4\\}/Copyright (c) $CURRENT_YEAR/\" LICENSE; fi; fi'"
language = "system"
files = "^LICENSE$"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "prevent-swift-disabled-files"
name = "🚫 Preventing .swift.disabled files from being committed..."
entry = '''bash -c 'if git diff --cached --name-only | grep -q "\.swift\.disabled$"; then echo "🛑 .swift.disabled files are temporary disabled test files and should not be committed!"; echo "Please remove or rename these files before committing:"; git diff --cached --name-only | grep "\.swift\.disabled$"; exit 1; fi''''
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "protect-essential-files"
name = "🛡️ Protecting essential files from deletion..."
entry = """bash -c 'PROTECTED_FILES=("AGENTS.md" "CLAUDE.md" "CODE_OF_CONDUCT.md" "CONTRIBUTING.md" "Dangerfile.swift" "LICENSE" "RELEASING.md" "RULES.md" "SECURITY.md" "WORKFLOW.md" "spi.yml" ".swiftlint.yml" ".swift-format" "prek.toml" ".github/workflows/ci.yml" "scripts/build-documentation.sh" "scripts/validate-boundaries.sh" ".periphery.yml" ".mcp.json" ".gitmessage" ".gitignore" ".coderabbit.yaml" ".bead-config.yaml"); for file in "${PROTECTED_FILES[@]}"; do if git diff --cached --name-status | grep -q "^D.*$file$"; then echo "🛑 Essential file $file cannot be removed!"; echo "This file is protected and must remain in the repository."; exit 1; fi; done'"""
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "shellcheck-scripts"
name = "🐚 Checking shell scripts with ShellCheck..."
entry = "shellcheck"
language = "system"
files = '\.(sh|bash)$'
pass_filenames = true

[[repos.hooks]]
id = "makefile-check"
name = "🔨 Checking Makefiles..."
entry = """bash -c 'for file in "$@"; do echo "Checking $file..."; if ! make -n -f "$file" >/dev/null 2>&1; then echo "❌ Makefile $file has syntax errors"; exit 1; fi; done'"""
language = "system"
files = '^(Makefile|.*\.mk)$'
pass_filenames = true
